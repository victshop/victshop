<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VICT SHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        .product-img { aspect-ratio: 3 / 4; object-fit: cover; }
    </style>
</head>
<body class="bg-white text-gray-900">
    <header class="border-b sticky top-0 bg-white z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-center">
            <h1 class="text-2xl font-bold tracking-tighter">VICT SHOP</h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-10">
            <div class="group cursor-pointer">
                <div class="overflow-hidden bg-gray-100 mb-4">
                    <img src="https://via.placeholder.com/600x800" alt="상품 이미지" class="product-img w-full group-hover:scale-105 transition duration-300">
                </div>
                <h3 class="text-sm font-medium">샘플 상품 이름</h3>
                <p class="text-xs text-gray-500 mt-1">상품에 대한 짧은 설명입니다.</p>
                <p class="text-sm font-bold mt-2">45,000원</p>
            </div>
            </div>
    </main>

    <footer class="border-t py-10 mt-20 text-center text-xs text-gray-400">
        <p>© 2026 VICT SHOP. All rights reserved.</p>
    </footer>
</body>
</html>
