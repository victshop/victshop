<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VICT SHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        .hidden { display: none; }
        .product-img { aspect-ratio: 3 / 4; object-fit: cover; transition: transform 0.5s; }
        .product-card:hover .product-img { transform: scale(1.03); }
    </style>
</head>
<body class="bg-white text-gray-900">
    <header class="border-b sticky top-0 bg-white/80 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-[0.2em] cursor-pointer" onclick="showView('shop')">VICT SHOP</h1>
            <div id="auth-buttons" class="text-[10px] uppercase tracking-widest space-x-4">
                <span id="user-name-tag" class="text-black font-bold"></span>
                <button id="login-nav-btn" onclick="showView('login')" class="text-gray-400">Login</button>
                <button id="logout-nav-btn" onclick="handleLogout()" class="text-gray-400 hidden">Logout</button>
            </div>
        </div>
    </header>

    <section id="shop-view" class="max-w-7xl mx-auto px-4 py-12">
        <div id="product-container" class="grid grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-12">
            <p class="col-span-full text-center text-gray-400 py-20 italic tracking-widest">LOADING PRODUCTS...</p>
        </div>
    </section>

    <section id="login-view" class="hidden min-h-[70vh] flex items-center justify-center p-4">
        <div class="w-full max-w-sm space-y-8 text-center">
            <h2 class="text-2xl font-bold tracking-tighter italic">SIGN IN</h2>
            <div class="space-y-4">
                <input type="text" id="login-id" placeholder="ID" class="w-full border-b py-3 outline-none focus:border-black text-sm">
                <input type="password" id="login-pw" placeholder="PASSWORD" class="w-full border-b py-3 outline-none focus:border-black text-sm">
                <button onclick="handleLogin()" class="w-full bg-black text-white py-4 text-xs font-bold tracking-widest mt-4">LOGIN</button>
                <button onclick="showView('signup')" class="text-[10px] text-gray-400 underline tracking-widest uppercase">Create Account</button>
            </div>
        </div>
    </section>

    <section id="signup-view" class="hidden min-h-[70vh] flex items-center justify-center p-4">
        <div class="w-full max-w-sm space-y-6">
            <h2 class="text-2xl font-bold tracking-tighter text-center italic">REGISTER</h2>
            <div class="space-y-4">
                <input type="text" id="reg-id" placeholder="ID" class="w-full border-b py-2 text-sm outline-none focus:border-black">
                <input type="password" id="reg-pw" placeholder="PASSWORD" class="w-full border-b py-2 text-sm outline-none focus:border-black">
                <input type="text" id="reg-name" placeholder="NAME" class="w-full border-b py-2 text-sm outline-none focus:border-black">
                <input type="text" id="reg-phone" placeholder="PHONE (010-0000-0000)" class="w-full border-b py-2 text-sm outline-none focus:border-black">
                
                <div class="flex items-center gap-2 py-4">
                    <input type="checkbox" id="agree-check">
                    <label class="text-[10px] text-gray-500 underline cursor-pointer" onclick="showModal('terms')">이용약관 및 개인정보 처리방침에 동의합니다.</label>
                </div>
                
                <button onclick="handleSignup()" class="w-full bg-black text-white py-4 text-xs font-bold tracking-widest">CREATE ACCOUNT</button>
                <button onclick="showView('login')" class="w-full text-[10px] text-gray-400 tracking-widest uppercase text-center">Back to Login</button>
            </div>
        </div>
    </section>

    <div id="info-modal" class="fixed inset-0 bg-black/60 hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl p-8 rounded-lg max-h-[80vh] overflow-y-auto">
            <h2 id="info-title" class="text-lg font-bold mb-4"></h2>
            <div id="info-content" class="text-xs text-gray-500 leading-relaxed whitespace-pre-line border-t py-4"></div>
            <button onclick="closeInfoModal()" class="w-full bg-black text-white py-4 text-xs font-bold mt-4 tracking-widest uppercase">Close</button>
        </div>
    </div>

    <div id="order-modal" class="fixed inset-0 bg-black/60 hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md p-8 rounded-lg shadow-2xl text-center">
            <h2 id="modal-product-name" class="text-xl font-bold mb-8 italic tracking-widest">ORDER</h2>
            <p id="order-user-info" class="text-xs text-gray-400 mb-8 border-b pb-4"></p>
            <div class="bg-gray-50 p-6 rounded text-[11px] text-gray-500 leading-relaxed mb-8 italic">
                주문 접수 후 담당자가 직접 결제 안내 문자를 발송해 드립니다.
            </div>
            <div class="flex gap-2">
                <button onclick="closeOrderModal()" class="flex-1 py-4 border text-[11px] font-bold uppercase tracking-widest">Cancel</button>
                <button onclick="submitOrder()" id="submit-btn" class="flex-1 bg-black text-white py-4 text-[11px] font-bold uppercase tracking-widest">Confirm Order</button>
            </div>
        </div>
    </div>

    <footer class="border-t py-16 mt-20 text-center text-[11px] text-gray-500 leading-relaxed uppercase tracking-widest">
        <p class="font-bold mb-3 text-gray-800 italic">VICT SHOP</p>
        <p>Representative: YOU SUNG JO (유승조)</p>
        <p>Contact: 010-6666-5950</p>
        <p>Email: victbiz77@gmail.com</p>
        <div class="mt-8 text-[9px] text-gray-400">
            <p>© 2026 VICT SHOP. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyKJIMt3K1yBZrX91R-yOveenkqpLUXQvXm2qg5JzDUgwWaNjvPyndzlMRiR6x-N7iB/exec';
        let currentUser = JSON.parse(localStorage.getItem('victshop_user'));
        let currentProduct = '';

        const TERMS = "제1조 (목적)\n본 약관은 VICT SHOP이 운영하는 인터넷 사이트에서 제공하는 서비스를 이용함에 있어 이용자의 권리, 의무 및 책임사항을 규정함을 목적으로 합니다.\n\n제2조 (회원가입)\n이용자는 VICT SHOP이 정한 가입 양식에 따라 회원정보를 기입한 후 본 약관에 동의한다는 의사표시를 함으로써 회원가입을 신청합니다.";
        const PRIVACY = "1. 수집하는 개인정보 항목: 이름, 아이디, 비밀번호, 연락처\n2. 수집 목적: 회원 식별 및 주문 내역 관리, 결제 안내 문자 발송\n3. 보유 기간: 회원 탈퇴 시 혹은 비즈니스 종료 시까지";

        function updateAuthUI() {
            const nameTag = document.getElementById('user-name-tag');
            const loginBtn = document.getElementById('login-nav-btn');
            const logoutBtn = document.getElementById('logout-nav-btn');

            if(currentUser) {
                nameTag.innerText = currentUser.name.toUpperCase();
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
            } else {
                nameTag.innerText = '';
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
            }
        }

        function showView(view) {
            ['shop-view', 'login-view', 'signup-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(view + '-view').classList.remove('hidden');
            if(view === 'shop') loadProducts();
            window.scrollTo(0,0);
        }

        async function handleLogin() {
            const id = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;
            if(!id || !pw) return alert('Enter ID and Password.');

            try {
                const res = await fetch(`${WEB_APP_URL}?action=login&data=${encodeURIComponent(JSON.stringify({id, pw}))}`);
                const data = await res.json();
                if(data.result === 'success') {
                    currentUser = { id, name: data.name };
                    localStorage.setItem('victshop_user', JSON.stringify(currentUser));
                    updateAuthUI();
                    showView('shop');
                } else { alert('Invalid login credentials.'); }
            } catch (e) { alert('Error occurred.'); }
        }

        function handleLogout() {
            localStorage.removeItem('victshop_user');
            currentUser = null;
            updateAuthUI();
            location.reload();
        }

        async function handleSignup() {
            if(!document.getElementById('agree-check').checked) return alert('Please agree to terms.');
            const data = {
                id: document.getElementById('reg-id').value,
                pw: document.getElementById('reg-pw').value,
                name: document.getElementById('reg-name').value,
                phone: document.getElementById('reg-phone').value
            };
            if(!data.id || !data.pw || !data.name || !data.phone) return alert('Fill all fields.');

            const res = await fetch(`${WEB_APP_URL}?action=signup&data=${encodeURIComponent(JSON.stringify(data))}`);
            const text = await res.text();
            if(text === 'success') {
                alert('Account created. Please login.');
                showView('login');
            } else { alert('ID already exists.'); }
        }

        async function loadProducts() {
            const container = document.getElementById('product-container');
            try {
                const response = await fetch(`${WEB_APP_URL}?action=getProducts`);
                const products = await response.json();
                container.innerHTML = '';
                products.forEach(p => {
                    container.innerHTML += `
                        <div class="product-card group cursor-pointer" onclick="openOrderModal('${p.상품명}')">
                            <div class="overflow-hidden bg-gray-50 mb-5"><img src="${p.이미지URL}" class="product-img w-full"></div>
                            <div class="px-1 text-center md:text-left">
                                <h3 class="text-[13px] font-medium tracking-tight mb-1">${p.상품명}</h3>
                                <p class="text-[11px] text-gray-400 line-clamp-1 mb-2">${p.설명}</p>
                                <p class="text-[14px] font-bold">${Number(p.가격).toLocaleString()} KRW</p>
                            </div>
                        </div>
                    `;
                });
            } catch (e) { container.innerHTML = '<p class="col-span-full text-center">Error loading products.</p>'; }
        }

        function openOrderModal(name) {
            if(!currentUser) {
                alert('주문은 로그인 후에 가능합니다.');
                showView('login');
                return;
            }
            currentProduct = name;
            document.getElementById('modal-product-name').innerText = name;
            document.getElementById('order-user-info').innerText = `NAME: ${currentUser.name} / ID: ${currentUser.id}`;
            document.getElementById('order-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeOrderModal() {
            document.getElementById('order-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        async function submitOrder() {
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = 'PROCESSING...';
            const orderData = { product: currentProduct, name: currentUser.name, phone: currentUser.id, depositor: 'MEMBER' };
            await fetch(`${WEB_APP_URL}?action=addOrder&data=${encodeURIComponent(JSON.stringify(orderData))}`);
            alert('주문이 접수되었습니다.');
            closeOrderModal();
            btn.disabled = false;
            btn.innerText = 'CONFIRM ORDER';
        }

        function showModal(type) {
            document.getElementById('info-title').innerText = 'TERMS & PRIVACY';
            document.getElementById('info-content').innerText = TERMS + "\n\n" + PRIVACY;
            document.getElementById('info-modal').classList.remove('hidden');
        }
        function closeInfoModal() { document.getElementById('info-modal').classList.add('hidden'); }

        updateAuthUI();
        loadProducts();
    </script>
</body>
</html>
